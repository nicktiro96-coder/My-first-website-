
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      text-align: center;
      padding: 40px 20px;
      color: #222;
    }

    h1 {
      color: #087f5b;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 450px;
      margin: 30px auto;
      box-shadow: 0 4px 12px #00000015;
    }

    a {
      display: inline-block;
      background: #087f5b;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, world! 👋</h1>
    <p>Welcome to my first website.</p>
    <p>I am learning to build websites with GitHub.</p>
    <a href="https://github.com/">Visit GitHub</a>
  </div>
</body>
</html>
